apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-pilot
  labels:
    app: audit-pilot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: audit-pilot
  template:
    metadata:
      labels:
        app: audit-pilot
    spec:
      containers:
        - name: audit-pilot
          image: harbor.internal.rsm/ai-audit/audit-pilot:0.2.0
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: audit-pilot-llm-secret
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 8
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: audit-pilot-svc
spec:
  selector:
    app: audit-pilot
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: audit-pilot-ingress
  annotations:
    # 关键配置：关闭 Nginx 代理缓冲并延长 SSE 长连接读超时，防止流式审计输出被截断
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  rules:
    - host: audit-pilot.internal.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: audit-pilot-svc
                port:
                  number: 80
