[project]
name = "audit-pilot"
version = "0.2.0"
description = "AuditPilot V2 - 企业级智能审计与风险核查工作台"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27.2",
    "openai>=1.55.0",
    "openpyxl>=3.1.5",
    "pypdf>=5.1.0",
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
    "langgraph>=0.2.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
